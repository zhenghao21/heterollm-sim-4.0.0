<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F6F8FB"/>
<g id="heading" data-pptx-bounds="56 26 1168 155"><text x="56" y="48" font-size="18" font-weight="700" fill="#526479">HBM / HBF 建模　｜　01 总流程</text><text x="56" y="112" font-size="46" font-weight="700" fill="#11243A">像管理两种仓库一样，建模 HBM / HBF</text><text x="56" y="164" font-size="26" fill="#526479">把 LLM 访问落实到字节与地址，再按介质规则计算服务与排队</text></g>
<g id="warehouse-metaphor" data-pptx-bounds="270 185 740 370"><image href="../images/warehouse_metaphor.png" x="270" y="185" width="740" height="370" preserveAspectRatio="xMidYMid meet"/></g>
<g id="hbm-metaphor" data-pptx-bounds="56 231 216 264"><text x="56" y="278" font-size="34" font-weight="700" fill="#007FBA">HBM</text><text x="56" y="326" font-size="28" fill="#11243A">按行打开</text><text x="56" y="371" font-size="28" fill="#11243A">按小块传输</text><text x="56" y="436" font-size="22" fill="#526479">bank 像柜子</text><text x="56" y="475" font-size="22" fill="#526479">row 像抽屉</text></g>
<g id="hbf-metaphor" data-pptx-bounds="1030 231 194 264"><text x="1030" y="278" font-size="34" font-weight="700" fill="#B96628">HBF</text><text x="1030" y="326" font-size="28" fill="#11243A">整页读取</text><text x="1030" y="371" font-size="28" fill="#11243A">两槽暂存</text><text x="1030" y="436" font-size="22" fill="#526479">page 像整箱</text><text x="1030" y="475" font-size="22" fill="#526479">读缓冲像装卸位</text></g>
<g id="modeling-flow" data-pptx-bounds="56 565 1168 111"><text x="640" y="586" text-anchor="middle" font-size="24" fill="#526479">共同原则：地址决定去哪里，状态与资源竞争决定何时完成</text><rect x="56" y="613" width="1168" height="59" fill="#0C1B2B"/><text x="640" y="652" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">负载与配置　→　字节 / 地址　→　介质 + 排队　→　Token 指标</text></g>
<g id="footer" data-pptx-bounds="56 681 1168 31"><text x="56" y="703" font-size="16" fill="#526479">概念比喻，非芯片实物结构　｜　HBF 为每个 plane 两个读缓冲槽</text><text x="1224" y="703" text-anchor="end" font-size="18" fill="#526479">01 / 05</text></g></svg>
