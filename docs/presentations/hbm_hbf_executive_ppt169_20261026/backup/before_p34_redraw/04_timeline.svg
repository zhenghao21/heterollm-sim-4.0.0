<g id="heading" data-pptx-bounds="56 26 1168 155"><text x="56" y="48" font-size="18" font-weight="700" fill="#526479">HBM / HBF 建模　｜　04 资源时间线</text><text x="56" y="112" font-size="46" font-weight="700" fill="#11243A">同一条路要排队，不同资源可重叠</text><text x="56" y="164" font-size="26" fill="#526479">每个阶段都要等“数据已准备好”和“所需资源空闲”两个条件</text></g>
<g id="pipeline-timeline" data-pptx-bounds="56 211 1168 266"><text x="56" y="246" font-size="26" font-weight="700" fill="#B96628">HBF 示例</text><text x="56" y="284" font-size="22" fill="#526479">同一 plane</text><text x="56" y="320" font-size="22" fill="#526479">及其传输资源</text>
<text x="246" y="247" font-size="24" fill="#11243A">阵列</text><text x="246" y="326" font-size="24" fill="#11243A">内部通道</text><text x="246" y="405" font-size="24" fill="#11243A">host 出口</text>
<line x1="390" y1="254" x2="1224" y2="254" stroke="#B5C3CF" stroke-width="2"/><line x1="390" y1="333" x2="1224" y2="333" stroke="#B5C3CF" stroke-width="2"/><line x1="390" y1="412" x2="1224" y2="412" stroke="#B5C3CF" stroke-width="2"/>
<rect x="402" y="218" width="153" height="46" fill="#B96628"/><text x="478" y="249" text-anchor="middle" font-size="24" fill="#FFFFFF">读页 A</text><rect x="672" y="218" width="153" height="46" fill="#B96628"/><text x="748" y="249" text-anchor="middle" font-size="24" fill="#FFFFFF">读页 B</text>
<rect x="565" y="297" width="94" height="46" fill="#FBECDD" stroke="#B96628"/><text x="612" y="328" text-anchor="middle" font-size="24" fill="#B96628">填 A</text><rect x="835" y="297" width="94" height="46" fill="#FBECDD" stroke="#B96628"/><text x="882" y="328" text-anchor="middle" font-size="24" fill="#B96628">填 B</text>
<rect x="672" y="376" width="242" height="46" fill="#11243A"/><text x="793" y="407" text-anchor="middle" font-size="24" fill="#FFFFFF">输出 A</text><rect x="942" y="376" width="242" height="46" fill="#11243A"/><text x="1063" y="407" text-anchor="middle" font-size="24" fill="#FFFFFF">输出 B</text>
<path d="M555 265 L565 296 M659 344 L672 375 M825 265 L835 296 M929 344 L942 375" fill="none" stroke="#B5C3CF" stroke-width="2"/>
<text x="672" y="465" font-size="24" fill="#B96628">读 B 可与输出 A 重叠　｜　时间向右 →</text></g>
<g id="resource-rules" data-pptx-bounds="56 492 1168 107"><text x="56" y="523" font-size="26" font-weight="700" fill="#11243A">单阶段预约</text><text x="290" y="523" font-size="26" fill="#11243A">开始 = max（依赖就绪，资源就绪）；结束 = 开始 + 时长</text><text x="56" y="574" font-size="22" fill="#526479">HBM：同 channel 共享 Row CA / Column CA，各 PC 独立 DQ；另满足时钟和命令时序</text></g>
<g id="takeaway" data-pptx-bounds="56 610 1168 65"><rect x="56" y="617" width="1168" height="55" fill="#0C1B2B"/><text x="640" y="653" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">页映射、队列准入和槽可用性限制流水；双缓冲不保证始终满速</text></g>
<g id="footer" data-pptx-bounds="56 681 1168 31"><text x="56" y="703" font-size="16" fill="#526479">概念时间线，长短不代表数值　｜　每条资源有自己的预约日历；图中无虚构性能测量值</text><text x="1224" y="703" text-anchor="end" font-size="18" fill="#526479">04 / 05</text></g></svg>
