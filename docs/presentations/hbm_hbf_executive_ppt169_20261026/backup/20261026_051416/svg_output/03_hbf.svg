<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#F6F8FB"/>
<g id="heading" data-pptx-bounds="56 26 1168 155"><text x="56" y="48" font-size="18" font-weight="700" fill="#526479">HBM / HBF 建模　｜　03 HBF 页服务与读缓冲</text><text x="56" y="112" font-size="46" font-weight="700" fill="#11243A">HBF：整页取货，用双缓冲衔接三段服务</text><text x="56" y="164" font-size="26" fill="#526479">示例：16 die × 25 plane / 堆，4 KiB 页；连续页先分散到 die 通道，再轮换 plane</text></g>
<g id="stage-headings" data-pptx-bounds="56 201 1168 48"><circle cx="77" cy="225" r="18" fill="#B96628"/><text x="77" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">1</text><text x="110" y="234" font-size="28" font-weight="700" fill="#11243A">从阵列取一页</text><circle cx="483" cy="225" r="18" fill="#B96628"/><text x="483" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">2</text><text x="515" y="234" font-size="28" font-weight="700" fill="#11243A">搬入读缓存</text><circle cx="949" cy="225" r="18" fill="#B96628"/><text x="949" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">3</text><text x="981" y="234" font-size="28" font-weight="700" fill="#11243A">经出口送出</text></g>
<g id="array-and-media-buffer" data-pptx-bounds="56 265 382 178"><rect x="77" y="279" width="122" height="88" fill="#FFFFFF" stroke="#B5C3CF" stroke-width="2"/><rect x="88" y="292" width="122" height="88" fill="#FBECDD" stroke="#B96628"/><rect x="100" y="306" width="122" height="88" fill="#B96628"/><text x="161" y="343" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">新页 B</text><text x="161" y="378" text-anchor="middle" font-size="22" fill="#FFFFFF">4 KiB</text><text x="160" y="433" text-anchor="middle" font-size="22" fill="#526479">plane 页阵列</text><line x1="230" y1="340" x2="263" y2="340" stroke="#B96628" stroke-width="3" marker-end="url(#amber)"/><rect x="276" y="307" width="134" height="65" fill="#FBECDD" stroke="#B96628" stroke-width="2"/><text x="343" y="349" text-anchor="middle" font-size="26" font-weight="700" fill="#B96628">页 B</text><path d="M272 374 L272 384 L414 384 L414 374" fill="none" stroke="#B96628" stroke-width="3"/><text x="343" y="419" text-anchor="middle" font-size="22" fill="#526479">介质暂存</text></g>
<g id="internal-transfer-and-read-slots" data-pptx-bounds="430 250 430 201"><text x="492" y="310" text-anchor="middle" font-size="22" fill="#B96628">内部传输</text><path d="M434 340 L543 340 L543 377" fill="none" stroke="#B96628" stroke-width="3"/><line x1="543" y1="377" x2="562" y2="377" stroke="#B96628" stroke-width="3" marker-end="url(#amber)"/><text x="702" y="267" text-anchor="middle" font-size="18" fill="#526479">每个 plane：两个读缓存槽</text><rect x="551" y="274" width="302" height="142" fill="#FFFFFF" stroke="#B5C3CF" stroke-width="2"/><rect x="568" y="285" width="269" height="49" fill="#F6F8FB" stroke="#B5C3CF"/><rect x="580" y="295" width="25" height="29" fill="#526479"/><text x="623" y="318" font-size="24" fill="#526479">槽 A　已有页 A</text><rect x="568" y="352" width="269" height="49" fill="#FBECDD" stroke="#B96628" stroke-width="2"/><rect x="580" y="362" width="25" height="29" fill="#B96628"/><text x="623" y="385" font-size="24" font-weight="700" fill="#B96628">槽 B　新页 B</text><text x="702" y="442" text-anchor="middle" font-size="18" fill="#526479">内部搬完后，该槽才 ready</text></g>
<g id="host-and-hit-bypass" data-pptx-bounds="865 259 359 184"><text x="1004" y="284" text-anchor="middle" font-size="18" fill="#526479">已有页命中：从槽 A 直接送出</text><path d="M839 309 L926 309 L926 342" fill="none" stroke="#526479" stroke-width="2" stroke-dasharray="6,3"/><path d="M839 377 L894 377 L894 342 L1072 342" fill="none" stroke="#B96628" stroke-width="3" marker-end="url(#amber)"/><rect x="1084" y="295" width="140" height="84" fill="#11243A"/><text x="1154" y="347" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">请求方</text><text x="1005" y="416" text-anchor="middle" font-size="22" fill="#526479">host 出口传输</text></g>
<g id="hit-and-slot-rules" data-pptx-bounds="56 456 1168 99"><rect x="56" y="457" width="1168" height="48" fill="#FFFFFF" stroke="#B5C3CF"/><text x="74" y="489" font-size="26" fill="#11243A">命中：跳过阵列与内部填充；仍要等缓存槽 ready 和 host 出口空闲</text><text x="56" y="545" font-size="24" fill="#526479">槽的两道门：填完才能读（ready）；旧读者结束才能覆盖（reader_end）</text></g>
<g id="write-path" data-pptx-bounds="56 562 1168 38"><text x="56" y="588" font-size="26" font-weight="700" fill="#B96628">写入</text><text x="180" y="588" font-size="24" fill="#11243A">host → 内部传输 → program 结束；部分页写可能另付 RMW</text></g>
<g id="takeaway" data-pptx-bounds="56 610 1168 65"><rect x="56" y="617" width="1168" height="55" fill="#0C1B2B"/><text x="640" y="653" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">阵列读完还不算完成，必须等出口传输结束</text></g>
<g id="footer" data-pptx-bounds="56 681 1168 31"><text x="56" y="703" font-size="16" fill="#526479">generic_nand 基线：无默认 FTL / GC　｜　示例输入：读页 1 μs，program 100 μs，非本次测量</text><text x="1224" y="703" text-anchor="end" font-size="18" fill="#526479">03 / 05</text></g></svg>
