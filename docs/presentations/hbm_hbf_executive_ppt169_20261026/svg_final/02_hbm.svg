<g id="heading" data-pptx-bounds="56 26 1168 155"><text x="56" y="48" font-size="18" font-weight="700" fill="#526479">HBM / HBF 建模　｜　02 HBM 命令与状态</text><text x="56" y="112" font-size="46" font-weight="700" fill="#11243A">HBM：抽屉是否已打开，决定命令成本</text><text x="56" y="164" font-size="26" fill="#526479">每个 bank 同时保持一行打开；行命中、关闭与冲突，需要不同命令链</text></g>
