<g id="constraints" data-pptx-bounds="56 573 1168 105"><text x="56" y="596" font-size="24" fill="#526479">还计算命令间隔、ACT 速率、读写切换和刷新；写请求对应 WR / WL</text><rect x="56" y="617" width="1168" height="55" fill="#0C1B2B"/><text x="640" y="653" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">同样的字节数，行状态和排队也会改变访问延迟</text></g>
