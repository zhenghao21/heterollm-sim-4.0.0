<g id="heading" data-pptx-bounds="56 26 1168 155"><text x="56" y="48" font-size="18" font-weight="700" fill="#526479">HBM / HBF 建模　｜　04 资源时间线</text><text x="56" y="112" font-size="46" font-weight="700" fill="#11243A">同一条路要排队，不同资源可重叠</text><text x="56" y="164" font-size="26" fill="#526479">同一 plane；A / B 均未命中，各用一个初始空槽；共享内部通道和 host 读出口</text></g>
