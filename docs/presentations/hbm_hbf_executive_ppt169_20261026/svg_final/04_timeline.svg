<g id="overlap-and-reuse" data-pptx-bounds="56 498 1168 106"><text x="56" y="528" font-size="26" font-weight="700" fill="#B96628">② 可以重叠</text><text x="285" y="528" font-size="24" fill="#11243A">读 B、填槽 B 可与输出 A 重叠；B 用另一个槽</text><text x="56" y="576" font-size="26" font-weight="700" fill="#526479">③ 仍需等待</text><text x="285" y="576" font-size="24" fill="#11243A">同一出口不能同时读 A / B；覆盖槽 A 还要等它的旧读者结束</text></g>
