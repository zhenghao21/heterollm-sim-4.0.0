<text x="64" y="98" font-size="42" font-weight="700" fill="#11243A">HBM 地址映射与并行度</text><text x="64" y="146" font-size="24" fill="#526479">地址落在哪个 lane、bank 与 row，决定并行机会和冲突位置</text>
<g id="hbm-hierarchy" data-pptx-bounds="64 205 1152 210">
<rect x="64" y="218" width="190" height="126" fill="#007FBA"/><text x="159" y="267" text-anchor="middle" font-size="26" fill="#FFFFFF">Stack</text><text x="159" y="309" text-anchor="middle" font-size="22" fill="#FFFFFF">HBM 堆</text>
<text x="278" y="285" font-size="32" fill="#007FBA">→</text>
<rect x="336" y="218" width="230" height="126" fill="#E4F2FA"/><text x="451" y="267" text-anchor="middle" font-size="26" fill="#11243A">Channel × 32</text><text x="451" y="309" text-anchor="middle" font-size="22" fill="#526479">HBM4 每堆</text>
<text x="586" y="285" font-size="32" fill="#007FBA">→</text>
<rect x="642" y="218" width="232" height="126" fill="#E4F2FA"/><text x="758" y="267" text-anchor="middle" font-size="26" fill="#11243A">PC × 2</text><text x="758" y="309" text-anchor="middle" font-size="22" fill="#526479">每个物理 channel</text>
<text x="894" y="285" font-size="32" fill="#007FBA">→</text>
<rect x="950" y="218" width="266" height="126" fill="#E4F2FA"/><text x="1083" y="267" text-anchor="middle" font-size="26" fill="#11243A">Bank → Row</text><text x="1083" y="309" text-anchor="middle" font-size="22" fill="#526479">含 SID / bank group</text>
