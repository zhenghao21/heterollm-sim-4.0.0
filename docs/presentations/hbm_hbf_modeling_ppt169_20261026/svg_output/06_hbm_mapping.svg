<g id="bank-rotation" data-pptx-bounds="64 438 1152 185">
<text x="64" y="475" font-size="26" font-weight="700" fill="#007FBA">bank_interleaved</text><text x="456" y="475" font-size="26" fill="#11243A">先分散 lane → bank → column → row</text>
<text x="64" y="534" font-size="24" fill="#526479">同 SID 内轮换 bank group</text><text x="456" y="534" font-size="32" fill="#007FBA">0 → 8 → 1 → 9 → 2 → 10 → …</text>
<text x="456" y="587" font-size="22" fill="#526479">示意：每组 8 个 bank；持续访问不再一直落在同组</text>
